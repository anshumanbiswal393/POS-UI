name: Deploy POS UI

on:
  push:
    branches:
      - deploy
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Docker vite build + SSR regularly exceeds 10m; keep the job alive
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      - name: Add VM to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VM_PORT }} ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      - name: Sync files to VM
        env:
          SSH_OPTS: -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes
        run: |
          rsync -avz --delete \
            --exclude='.git' --exclude='node_modules' --exclude='dist' --exclude='.output' \
            --exclude='.env' --exclude='.env.local' --exclude='.wrangler' \
            -e "ssh -p ${{ secrets.VM_PORT }} $SSH_OPTS" \
            ./ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/opt/retrod/POS-UI/

      # Long docker builds look idle to middleboxes; keepalive + plain progress
      # prevents "client_loop: send disconnect: Broken pipe" (~10m SSH drop).
      - name: Build and restart pos-ui
        env:
          SSH_OPTS: -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=120 -o TCPKeepAlive=yes
        run: |
          ssh -p ${{ secrets.VM_PORT }} $SSH_OPTS ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} \
            'set -euo pipefail
             cd /opt/retrod/POS-UI
             docker compose build --progress=plain pos-ui
             docker compose up -d --force-recreate pos-ui
             docker image prune -f'

      - name: Sync deploy branch to main
        if: github.ref == 'refs/heads/main'
        run: |
          git push origin HEAD:refs/heads/deploy --force
